# Example local workflow configuration.
#
# Copy this file to `.ai-dev-workflow.local.yaml` when a workflow hub needs
# machine-local checkout paths, secret references, or local tool overrides.
# The real local file is gitignored. Keep all values here as placeholders.

# Optional default root used when a product repo has no explicit local_path.
checkout_root: ../repos

# Product-repo local context. Names must match
# workflow_hub.product_repos[].name in `.ai-dev-workflow.yaml`.
product_repos:
  - name: mobile-app
    local_path: ../repos/mobile-app
    github_app:
      private_key_path: ~/.config/example/mobile-app-github-app.pem
      secret_ref: op://ExampleVault/mobile-app-github-app/private-key
  - name: admin-portal
    # With checkout_root above, this defaults to ../repos/admin-portal.
    github_app:
      secret_ref: op://ExampleVault/admin-portal-github-app/private-key

# Compatibility: product_repos[].private_key_path and
# product_repos[].secret_ref remain accepted as local-only aliases. Prefer the
# nested github_app form for new setup.

# Local reviewer/tool overrides. These are developer-specific and should not be
# committed to the shared workflow config.
#
# Deliberate machine-local narrowing example:
# - copy this file to `.ai-dev-workflow.local.yaml`
# - narrow `review.on_draft.runner` when this machine lacks some runtimes
# - override GitHub/App reviewer lists to match the tools available on this
#   machine, for example PR Agent during draft and Codex GitHub after ready
# - keep `internal_reviewers_unavailable_policy: warn` unless you explicitly
#   want unavailable local reviewers to hard-fail the gate
# - if this override was only a former gate workaround, remove the runner key;
#   Before retiring a file in a downstream project, ensure the exact backup
#   name `.ai-dev-workflow.local.yaml.retired` is covered by its .gitignore.
#   Then move the whole file aside, do not delete it: `mv .ai-dev-workflow.local.yaml
#   .ai-dev-workflow.local.yaml.retired`. The gitignored file cannot be restored
#   by a later rollback.
review:
  on_draft:
    runner:
      - cursor
    github:
      - pr-agent
  on_ready:
    github:
      - codex-github
  internal_reviewers_unavailable_policy: warn

tools:
  haystack:
    command: haystack
  browser:
    provider: playwright_cli

# Optional sync-template source. Use either local_path or git_url.
template:
  source:
    local_path: ../ai-dev-framework-template
    # git_url: https://github.com/example/ai-dev-framework-template
