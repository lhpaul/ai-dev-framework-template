# sync-manifest.yaml
# Authoritative list of all framework-managed files and their sync category.
# Consumed by sync-template artefacts (Claude Code, Cursor, Codex) at runtime.
#
# Schema version: 1
#
# Categories:
#   always_sync       - Framework-owned files. Must be kept in sync with the upstream template.
#                       The agent presents all out-of-date entries to the maintainer before
#                       applying; the maintainer may decline individual files but no always-sync
#                       file with a diff may be silently omitted from the summary (BR-2, BR-7).
#   special_handling  - Files that may have project-specific customisations.
#                       Always show the full diff; the maintainer decides per file.
#   project_specific  - Files owned by the downstream project. Never overwrite.
#                       The agent may propose additive updates but must preserve all
#                       project-specific content. Files with mixed_content: true contain
#                       both template-owned and project-owned sections separated by
#                       annotation markers (see annotation_scheme below).
#
# Mode scopes:
#   shared                  - File applies across supported repository roles.
#   hub_only                - File belongs only in a workflow hub repository.
#   product_repo_injection  - File may be injected into a product repository.
#
# Sync-template uses mode_scope to filter the manifest by repository role before
# comparing or applying files. Missing mode resolves to single_repo and keeps the
# compatibility file set. workflow_hub selects shared and hub_only entries.
# product_repo selects shared and product_repo_injection entries. Unknown roles,
# missing mode_scope values, and unknown mode_scope values fail closed before
# file changes are applied.
#
# Annotation schemes (used in mixed_content files):
#   html_comments     - Markers in Markdown files:
#                         <!-- TEMPLATE-OWNED-START --> ... <!-- TEMPLATE-OWNED-END -->
#                       Markers in YAML files (must be wrapped in YAML comment syntax):
#                         # <!-- TEMPLATE-OWNED-START --> ... # <!-- TEMPLATE-OWNED-END -->
#
# NOTE: If a new framework file is added to the template, add a corresponding entry here.
# Files absent from this manifest will not be included in always-sync batches.
# (CI-enforced manifest completeness is out of scope for this iteration — see issue #252.)

schema_version: 1

mode_scopes:
  shared:
    label: Shared
    description: File applies across supported repository roles.
  hub_only:
    label: Hub only
    description: File belongs only in a workflow hub repository.
  product_repo_injection:
    label: Product repository injection
    description: File may be injected into a product repository integration.

categories:
  always_sync:
    - path: REVIEW.md
      mode_scope: shared
      note: canonical review contract for spec, plan, and code review gates
    - path: docs/workflow/
      glob: "**/*"
      mode_scope: hub_only
      note: full workflow documentation tree (all files recursively)
    - path: .claude/agents/
      glob: "*.md"
      mode_scope: hub_only
      note: Claude Code agent definitions
    - path: .claude/commands/
      glob: "*.md"
      mode_scope: hub_only
      note: Claude Code slash commands
    - path: .claude/skills/
      glob: "*.md"
      mode_scope: hub_only
      note: Claude Code skills
    - path: .codex/skills/
      glob: "**/*"
      mode_scope: hub_only
      note: Codex skill trees shipped with the template (SKILL.md and assets)
    - path: .agents/skills/
      glob: "**/*"
      mode_scope: hub_only
      note: Codex repo-scoped skill discovery path and command-style aliases
    - path: .cursor/commands/
      glob: "*.md"
      mode_scope: hub_only
      note: Cursor slash commands
    - path: .cursor/agents/
      glob: "*.md"
      mode_scope: hub_only
      note: Cursor subagent definitions
    - path: .cursor/rules/
      glob: "*.mdc"
      mode_scope: hub_only
      note: Cursor rules files
    - path: scripts/development-workflow/
      glob: "**/*"
      mode_scope: hub_only
      note: workflow helper scripts (state inspection, PR/CI loops, etc.)
    - path: scripts/lint/
      glob: "**/*"
      mode_scope: shared
      note: lint helpers referenced by workflow protocols and best-practice docs
    - path: scripts/README.md
      mode_scope: shared
      note: purpose and usage of scripts in scripts/
    - path: docs/best-practices/1-general.md
      mode_scope: shared
      note: general coding standards
    - path: docs/best-practices/2-version-control.md
      mode_scope: shared
      note: git and branching conventions
    - path: docs/best-practices/3-testing.md
      mode_scope: shared
      note: testing standards
    - path: template/workflow-hub/
      glob: "**/*"
      mode_scope: shared
      note: inspectable workflow hub skeleton documentation and manifest
    - path: template/product-repo-injection/
      glob: "**/*"
      mode_scope: shared
      note: inspectable product repository injection skeleton documentation and manifest
    - path: sync-manifest.yaml
      mode_scope: shared
      note: this manifest file itself; must be synced so downstream projects receive manifest updates

  special_handling:
    - path: .claude/settings.json
      mode_scope: hub_only
      note: may have project-specific tool permissions
    - path: .claude/settings.local.json.example
      mode_scope: hub_only
      note: local settings example file
    - path: .github/workflows/auto-tag-release.yml
      mode_scope: shared
      note: automated release tagging; add if CI is set up
    - path: .github/workflows/deploy.yml
      mode_scope: shared
      note: placeholder deployment workflow; customize with project-specific deploy logic
    - path: .github/workflows/e2e-regression.yml
      mode_scope: shared
      note: label-gated e2e/regression placeholder; customize with project-specific test logic
    - path: .github/workflows/update-tracker-on-merge.yml
      mode_scope: shared
      note: tracker automation may be customized; review and retain graduation closeout wiring when adopted
    - path: e2e/
      glob: "**/*"
      mode_scope: shared
      note: placeholder e2e/regression test project (Playwright); customize with project-specific tests
    - path: .cursor/BUGBOT.md
      mode_scope: hub_only
      note: project-specific Cursor Bugbot review rules; customize when enabling Bugbot

  project_specific:
    - path: AGENTS.md
      mixed_content: true
      annotation_scheme: html_comments
      mode_scope: product_repo_injection
      note: >
        workflow table (## Development Workflow section) is template-owned;
        project fills in ## Project Overview and ## Repository Structure sections
    - path: README.md
      mode_scope: shared
      note: project-specific README; template version is a starting point only
    - path: CHANGELOG.md
      mode_scope: shared
      note: project maintains its own changelog; never overwrite
    - path: .ai-dev-workflow.yaml
      mixed_content: true
      annotation_scheme: html_comments
      mode_scope: product_repo_injection
      note: >
        schema description comments are template-owned;
        provider selections (platforms, internal_reviewers, etc.) are project-specific
    - path: .ai-dev-workflow.local.example.yaml
      mode_scope: product_repo_injection
      note: placeholder-only example for local checkout roots, product paths, and secret references
    - path: docs/project/
      glob: "**/*"
      mode_scope: shared
      note: project domain docs; entirely project-specific
    - path: docs/best-practices/STACK-SPECIFIC.md
      mode_scope: shared
      note: stack summary; project fills in its own technology choices
    - path: docs/best-practices/stack/
      glob: "**/*"
      mode_scope: shared
      note: per-technology convention files; project-specific
    - path: .gitignore
      mode_scope: shared
      note: project-specific ignore rules
    - path: CLAUDE.md
      mode_scope: hub_only
      note: symlink to AGENTS.md; project-specific
    - path: GEMINI.md
      mode_scope: shared
      note: symlink to AGENTS.md; project-specific

# migration_notes: versioned manual steps required when syncing across a breaking structural change.
#
# Each entry is shown to the maintainer when their last_synced_version is older than
# `applies_if_syncing_from_before` (semver comparison). If last_synced_version is absent
# (first sync or unknown), all entries are shown.
#
# The agent must present all applicable notes and require explicit acknowledgment
# before proceeding to Step 2 (file comparison). Migration steps must be completed
# and committed before the sync diff is applied.
#
# Fields:
#   version                       - template version that introduced the breaking change
#   title                         - short label shown in the pre-sync summary
#   description                   - what changed and why migration is needed
#   applies_if_syncing_from_before - show this note when last_synced_version < this value
#   manual_steps                  - ordered list of shell commands or instructions the maintainer must run
migration_notes:
  - version: "0.23.0"
    title: "docs/ai/ renamed to docs/workflow/"
    description: >
      The framework documentation directory was renamed from docs/ai/ to docs/workflow/.
      If the project still has a docs/ai/ directory, it must be renamed before the sync
      diff is applied — otherwise the template files land in docs/workflow/ while the old
      docs/ai/ tree remains, leaving both directories in place.
    applies_if_syncing_from_before: "0.23.0"
    manual_steps:
      - "Check whether the old directory exists: ls docs/ai/ 2>/dev/null && echo 'exists' || echo 'already renamed'"
      - "If it exists, rename it: git mv docs/ai docs/workflow"
      - "Commit the rename before applying template file updates: git add -A && git commit -m 'refactor: rename docs/ai to docs/workflow (template migration to v0.23.0)'"

# rename_detections: directories previously used for always-sync content that were renamed
# in the template. The sync-template skill checks each entry during Step 2: if old_path
# exists in the project while new_path is in the always_sync list, the skill records a
# rename cleanup candidate.
#
# In Step 3, candidates are presented under a "Rename cleanup" section so the maintainer
# can approve: (1) deletion of the stale old_path directory, and (2) an offer to scan
# project-specific files for cross-references to old_path and update them to new_path.
# The skill MUST NOT delete old_path or modify any cross-references without explicit
# maintainer approval for each action.
#
# Fields:
#   old_path      - the stale directory path that should be removed after the rename
#   new_path      - the replacement path (must be in categories.always_sync)
#   introduced_in - template version when the rename was introduced
#   description   - short human-readable explanation shown in the Step 3 summary
rename_detections:
  - old_path: docs/ai/
    new_path: docs/workflow/
    introduced_in: "0.23.0"
    description: >
      docs/ai/ was renamed to docs/workflow/ in template v0.23.0. The stale docs/ai/
      directory still exists in the project alongside the new docs/workflow/ tree.
