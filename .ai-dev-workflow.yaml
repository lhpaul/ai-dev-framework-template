# <!-- TEMPLATE-OWNED-START -->
# AI Development Workflow Configuration
#
# This file declares which workflow integrations this repository uses.
# Keep it declarative and repo-safe: select providers here, but do not store
# secrets, tokens, hostnames, or other environment-specific credentials.
#
# See docs/workflow/development-workflow/README.md and
# docs/workflow/development-workflow/integrations/ for integration-specific setup.
#
# Important:
# - review.platforms is consumed by scripts/development-workflow/pr-review-loop.sh
#   for external automated PR review (Step 7).
# - review.internal_reviewers is consumed by the Step 7a internal review gate
#   protocol (91-orchestrate-work-protocol.md).
# - Other sections are advisory until additional scripts or agents adopt them.
#
# Behavior for automated PR review:
# - If this file is absent, or review.platforms is omitted or empty, the review
#   loop reports skipped (not configured).
# <!-- TEMPLATE-OWNED-END -->

schema_version: 1

review:
  # Ordered list of automated PR review platforms to run sequentially.
  # Platforms are evaluated in order; the first blocking result stops the loop.
  # Supported today by pr-review-loop.sh: greptile, devin, coderabbit, pr-agent, codex-github, claude-code-action, haystack, copilot
  platforms:
    - pr-agent
    - haystack
    - claude-code-action
  #
  # Platforms listed here are treated as "after-clean" reviewers by
  # pr-review-loop.sh: earlier platforms must reach clean before these platforms
  # are considered the value-measurement phase. The protocol keeps PRs as drafts
  # while PR-Agent and Haystack clear, then converts to non-draft so
  # claude-code-action can run after the clean gate. This makes claude-code-action's
  # net-new findings measurable. Requires ANTHROPIC_API_KEY in GitHub Actions secrets.
  phase_after_clean:
    - claude-code-action
  #
  # Configurable codex-github options (set via env vars or script flags to codex-github-reviewer.sh):
  #   CODEX_GITHUB_TRIGGER_PHRASE  — trigger phrase sent to the bot (default: "@codex review")
  #   CODEX_GITHUB_BOT_LOGIN       — GitHub login of the Codex bot account
  #                                  (default: "codex-ai[bot]"; verify from GitHub App settings)
  #
  # Additional options available as script flags to codex-github-reviewer.sh (passed via pr-review-loop.sh):
  #   --poll-interval <seconds>    — polling interval while waiting for bot response (default: 30)
  #   --max-wait      <seconds>    — maximum total wait time for bot response (default: 300)
  #
  # Copilot platform options:
  #   Prerequisites: an active GitHub Copilot seat or the Copilot for Pull Requests feature
  #                  must be enabled on the repository. GitHub Enterprise Server (GHES) is
  #                  not supported. See docs/workflow/development-workflow/integrations/copilot.md
  #   COPILOT_BOT_LOGIN  — override the default Copilot bot login
  #                        (default: "copilot-pull-request-reviewer[bot]")

  # Ordered list of internal AI reviewers to run sequentially on draft PRs
  # (Step 7a in 91-orchestrate-work-protocol.md) before converting to non-draft.
  # All listed reviewers must APPROVE before `gh pr ready` is called.
  #
  # Supported values:
  #   claude        — dispatches the stage-appropriate reviewer agent:
  #                     spec/*               -> spec-reviewer
  #                     implementation-plan/* -> implementation-plan-reviewer
  #                     feature/*/refactor/*/fix/*/hotfix/* -> code-reviewer
  #   codex         — dispatches the stage-appropriate Codex review skill:
  #                     spec/*               -> workflow-spec-reviewer
  #                     implementation-plan/* -> workflow-plan-reviewer
  #                     feature/*/refactor/*/fix/*/hotfix/* -> workflow-code-reviewer
  #   coderabbit  — triggers CodeRabbit GitHub App auto-review on the draft PR
  #                 (same mechanism as Step 7 but on a draft PR before non-draft
  #                 conversion). Requires: App installed, auto_review.enabled: true
  #                 in .coderabbit.yaml, and draft PRs not filtered out by the App.
  #                 Reachability is determined at runtime by checking App activity
  #                 on the repository. See docs/workflow/development-workflow/
  #                 integrations/coderabbit.md Step 7a section for setup details.
  #
  # Runner-context constraint:
  #   'codex' as a direct CLI reviewer is NOT reliably reachable from automated
  #   subagent runners (Claude Code subagents, Cursor subagents, or any headless
  #   environment). It is typically only reachable when Codex is the top-level
  #   runner itself. Protocol 91 Step 7a will classify 'codex' as unreachable in
  #   these contexts and emit a warning comment on the PR, then proceed with only
  #   'claude' under the default 'warn' policy. This is expected behaviour — not
  #   a misconfiguration.
  #
  # Local override: developers who do not have access to all tools listed here
  # can override this list locally by creating .tmp/template-config.json in the
  # repository root (this path is gitignored). Format:
  #   { "overrides": { "review": { "internal_reviewers": ["claude"] } } }
  # The overrides key takes precedence over this file for the local environment.
  # See docs/workflow/development-workflow/protocols/91-orchestrate-work-protocol.md
  # Step 7a for the full multi-reviewer gate procedure.
  internal_reviewers:
    - claude

  # Optional: policy when a listed internal reviewer is unreachable from the current runner.
  # Protocol 91 Step 7a enforces this policy at runtime.
  #
  # Allowed values:
  #   warn                    — (default) Emit a warning comment on the PR and proceed with
  #                             the reachable subset. Hard-fails only if zero reviewers are reachable.
  #   fail-if-any-unavailable — Hard-fail the Step 7a gate whenever any listed reviewer is
  #                             unreachable, even if others are reachable.
  #
  # Uncomment and set to override the default:
  # internal_reviewers_unavailable_policy: warn

issue_tracker:
  # Supported examples: linear, github_projects, github_issues, jira, clickup, notion, none
  provider: github_projects
  # GitHub Projects project number (the integer in the project URL, e.g. /users/<owner>/projects/1).
  # Used by workflow-lib.sh as a fallback when GITHUB_PROJECT_NUMBER env var is not set.
  # Required for tracker status updates (update_tracker_status_best_effort) and status reads
  # (get_tracker_status_for_issue) to function without setting an environment variable.
  project_number: 1
  # custom_fields: flat key-value map of provider-specific fields.
  # Each integration doc defines which keys are recognised and their effect.
  # Unrecognised keys are silently ignored by scripts that do not consume them.
  # Read individual values with: workflow_issue_tracker_custom_field <key>
  # (defined in scripts/development-workflow/workflow-lib.sh)
  #
  # Example (Linear):
  #   custom_fields:
  #     project: my-linear-project-id
  #
  # custom_fields:
  #   project: ""

vcs:
  # Supported examples: github, gitlab, bitbucket, other
  provider: github

browser_automation:
  # Supported examples: cursor_ide_browser_mcp, playwright_mcp, playwright_cli, none
  provider: playwright_cli

template:
  # Set to true when this repository IS a framework template (i.e., it ships workflow
  # tooling to be consumed by downstream projects). When true, Protocol 02 Step 0
  # (Template-Fit Check) is mandatory before writing any implementation plan.
  # Leave false or omit for downstream consumer repositories.
  is_template: true

  # Optional: upstream template repository reference (owner/repo format for GitHub).
  # When set, the retrospective protocol (Step 3b) cross-references each finding
  # against the specified template repository's issue tracker. Leave empty or omit to skip.
  # Note: this is set by DOWNSTREAM repos pointing back to their template origin —
  # the template repo itself leaves this empty.
  repository: ""

  # Optional: the template version last applied by the sync-template skill.
  # Written automatically by sync-template after a successful sync.
  # Used by the retrospective cross-reference step to identify "already fixed upstream" findings.
  last_synced_version: ""
