# <!-- TEMPLATE-OWNED-START -->
# AI Development Workflow Configuration
#
# This file declares which workflow integrations this repository uses.
# Keep it declarative and repo-safe: select providers here, but do not store
# secrets, tokens, hostnames, or other environment-specific credentials.
#
# See docs/workflow/development-workflow/README.md and
# docs/workflow/development-workflow/integrations/ for integration-specific setup.
#
# Important:
# - review.platforms is consumed by scripts/development-workflow/pr-review-loop.sh
#   for external automated PR review (Step 7).
# - review.internal_reviewers is consumed by the Step 7a internal review gate
#   protocol (91-orchestrate-work-protocol.md).
# - Other sections are advisory until additional scripts or agents adopt them.
#
# Behavior for automated PR review:
# - If this file is absent, or review.platforms is omitted or empty, the review
#   loop reports skipped (not configured).
# <!-- TEMPLATE-OWNED-END -->

schema_version: 1

review:
  # Ordered list of automated PR review platforms to run sequentially.
  # Platforms are evaluated in order; the first blocking result stops the loop.
  # Supported today by pr-review-loop.sh: greptile, devin, coderabbit
  platforms:
    - devin
    - coderabbit

  # Ordered list of internal AI reviewers to run sequentially on draft PRs
  # (Step 7a in 91-orchestrate-work-protocol.md) before converting to non-draft.
  # All listed reviewers must APPROVE before `gh pr ready` is called.
  #
  # Supported values:
  #   claude  — dispatches the stage-appropriate reviewer agent:
  #               spec/*               -> spec-reviewer
  #               implementation-plan/* -> implementation-plan-reviewer
  #               feature/*/refactor/*/fix/*/hotfix/* -> code-reviewer
  #   codex   — dispatches the stage-appropriate Codex review skill:
  #               spec/*               -> workflow-spec-reviewer
  #               implementation-plan/* -> workflow-plan-reviewer
  #               feature/*/refactor/*/fix/*/hotfix/* -> workflow-code-reviewer
  #
  # Runner-context constraint:
  #   'codex' as a direct CLI reviewer is NOT reliably reachable from automated
  #   subagent runners (Claude Code subagents, Cursor subagents, or any headless
  #   environment). It is typically only reachable when Codex is the top-level
  #   runner itself. Protocol 91 Step 7a will classify 'codex' as unreachable in
  #   these contexts and emit a warning comment on the PR, then proceed with only
  #   'claude' under the default 'warn' policy. This is expected behaviour — not
  #   a misconfiguration.
  #
  #   A future improvement (tracked in the template backlog) will add a
  #   GitHub-integration-based Codex reviewer path that works from any runner by
  #   posting a review trigger comment and polling for the Codex bot response.
  #
  #   To suppress the recurring warning in the meantime, remove 'codex' from this
  #   list or override it locally via .tmp/template-config.json (see below).
  #
  # Local override: developers who do not have access to all tools listed here
  # can override this list locally by creating .tmp/template-config.json in the
  # repository root (this path is gitignored). Format:
  #   { "overrides": { "review": { "internal_reviewers": ["claude"] } } }
  # The overrides key takes precedence over this file for the local environment.
  # See docs/workflow/development-workflow/protocols/91-orchestrate-work-protocol.md
  # Step 7a for the full multi-reviewer gate procedure.
  internal_reviewers:
    - claude
    - codex  # not reachable from automated subagent runners (Claude Code or Cursor); skipped with a warning

  # Optional: policy when a listed internal reviewer is unreachable from the current runner.
  # Protocol 91 Step 7a enforces this policy at runtime.
  #
  # Allowed values:
  #   warn                    — (default) Emit a warning comment on the PR and proceed with
  #                             the reachable subset. Hard-fails only if zero reviewers are reachable.
  #   fail-if-any-unavailable — Hard-fail the Step 7a gate whenever any listed reviewer is
  #                             unreachable, even if others are reachable.
  #
  # Uncomment and set to override the default:
  # internal_reviewers_unavailable_policy: warn

issue_tracker:
  # Supported examples: linear, github_projects, github_issues, jira, clickup, notion, none
  provider: github_projects

vcs:
  # Supported examples: github, gitlab, bitbucket, other
  provider: github

browser_automation:
  # Supported examples: cursor_ide_browser_mcp, playwright_mcp, playwright_cli, none
  provider: playwright_cli
