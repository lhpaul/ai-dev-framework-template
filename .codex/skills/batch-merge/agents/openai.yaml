interface:
  display_name: "Batch merge"
  short_description: "Merge all ready PRs in a parallel batch into develop, auto-resolving trivial conflicts."
  default_prompt: "Run batch merge: discover all PRs labeled ready-for-human-review targeting develop, filtering out drafts and PRs labeled needs-fixes (or use the explicit PR list I provide). Warn me about any PR missing the ready-for-human-review label and require my explicit include-or-skip decision. Confirm the ordered merge plan with me before merging anything. Then merge sequentially: auto-resolve CHANGELOG conflicts (combine all Unreleased entries, none dropped) and documentation file conflicts only when non-overlapping; escalate overlapping doc changes and all other conflicts for human resolution. After each successful merge: push origin develop, verify GitHub shows MERGED, delete the remote branch if still present, create a temporary local branch if needed, then run post-merge-cleanup. Handle MERGE_RESULT=failed by reporting the error, marking it failed, and continuing to the next PR. Always end with a final outcome table listing every candidate PR with its result code (merged_clean, merged_auto, merged_human, skipped_not_ready, skipped_conflict, failed, not_attempted)."

policy:
  allow_implicit_invocation: false
