interface:
  display_name: "Batch merge"
  short_description: "Merge all ready PRs in a parallel batch into develop, auto-resolving trivial conflicts."
  default_prompt: "Run batch merge: discover all PRs labeled ready-for-human-review targeting develop (or use the explicit PR list I provide), check each PR for the ready-for-human-review label and warn me about any missing it, confirm the ordered merge plan with me before merging, then merge them sequentially. Auto-resolve CHANGELOG conflicts (combine all Unreleased entries, none dropped) and documentation file conflicts only when the changes are non-overlapping; escalate overlapping doc changes and all other conflicts for human resolution."

policy:
  allow_implicit_invocation: false
