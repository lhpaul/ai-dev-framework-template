interface:
  display_name: "Workflow Orchestrator"
  short_description: "Propose and supervise the largest safe workflow batch."
  default_prompt: "Use $workflow-orchestrator to inspect workflow state, advance deterministic in-flight work, and propose the largest safe Backlog start batch. Before dispatching an explicit-list batch where any runner may mutate, including sequential fallback, build the Protocol 90 isolation manifest and require a distinct absolute worktree path plus isolation: \"worktree\" for every mutating item. Stop before dispatch on missing isolation assignment or duplicate worktree path; non-isolated runners are allowed only when explicitly classified read_only and will not edit files, switch branches, commit, push, mutate PRs, change labels, or update tracker state. Include the incremental commit requirement in substantial or multi-part mutating handoffs: commit immediately after each completed logical sub-part and never commit incomplete or failing work only to satisfy the rule. For checkpoint-resume redispatch, pass checkpoint state with the complete isolation assignment to a fresh runner and require checkpoint-resume-gate.sh before mutation; do not resume a paused runner while sibling runners remain active, and isolation verification never satisfies or waives checkpoint state. Treat merge authority explicitly: merge_granted means readiness is intermediate and in-scope PRs continue through delegated merge; merge_denied means ready PRs stop as ready_human_merge; failed delegated merge gates report merge_blocked; for Protocol 94 batch merges, keep the explicit in-scope PR list frozen and run batch-merge.sh recheck-remaining --prs <comma-separated-in-scope-prs> --after-merged-pr <number> --base <target-base> --approved-unready-prs <human-included-unready-prs> after each successful sibling merge before selecting the next PR and apply Protocol 94 Step 4.2 as the source of truth for post-recheck admission semantics; delegated merge authority never authorizes force-pushing a PR branch, so destructive PR branch updates must stop before mutation and route through scripts/development-workflow/workflow-branch-push-guard.sh; in workflow_hub, resolve the helper from WORKFLOW_TOOL_ROOT and pass the pushed checkout as --repo-root \"$ARTIFACT_REPO_ROOT\"; unexplained stalled-at-ready PRs are policy_inconsistent; unrelated discovered PRs are out_of_scope. Require scope-residual gate evidence before accepting readiness for broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness items. In workflow_hub mode, include selected product repository context in implementation handoffs; single_repo does not require --repo."

policy:
  allow_implicit_invocation: true
