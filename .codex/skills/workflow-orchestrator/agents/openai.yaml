interface:
  display_name: "Workflow Orchestrator"
  short_description: "Propose and supervise the largest safe workflow batch."
  default_prompt: "Use $workflow-orchestrator to inspect workflow state, advance deterministic in-flight work, and propose the largest safe Backlog start batch. Before dispatching an explicit-list batch where any runner may mutate, including sequential fallback, build the Protocol 90 isolation manifest and require a distinct absolute worktree path plus isolation: \"worktree\" for every mutating item. Stop before dispatch on missing isolation assignment or duplicate worktree path; non-isolated runners are allowed only when explicitly classified read_only and will not edit files, switch branches, commit, push, mutate PRs, change labels, or update tracker state. Treat merge authority explicitly: merge_granted means readiness is intermediate and in-scope PRs continue through delegated merge; merge_denied means ready PRs stop as ready_human_merge; failed delegated merge gates report merge_blocked; unexplained stalled-at-ready PRs are policy_inconsistent; unrelated discovered PRs are out_of_scope. Require scope-residual gate evidence before accepting readiness for broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness items. In workflow_hub mode, include selected product repository context in implementation handoffs; single_repo does not require --repo."

policy:
  allow_implicit_invocation: true
