interface:
  display_name: "Workflow Implementer"
  short_description: "Implement a feature, fix, or hotfix in code."
  default_prompt: "Use $workflow-implementer to implement the approved workflow item. With BATCH_CONTEXT=true, run the pre-mutation isolation self-check before edits, branch-changing commands, commits, pushes, or PR/tracker mutation; require isolation: \"worktree\", expected worktree path, expected branch, artifact repo root, approved base branch, and mutation classification; ensure pwd -P equals the expected worktree path or begins with the expected worktree path followed by / and HEAD matches only the expected branch. Stop on missing metadata, wrong CWD, main-repo CWD, or wrong branch. Produce and verify scope-residual evidence before readiness for broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness work. In workflow_hub mode, stop before mutation unless selected product repository, artifact owner, and mutation target are clear."

policy:
  allow_implicit_invocation: true
