interface:
  display_name: "Workflow Implementer"
  short_description: "Implement a feature, fix, or hotfix in code."
  default_prompt: "Use $workflow-implementer to implement the approved workflow item. For substantial or multi-part mutating implementation work, commit immediately after each completed logical sub-part and never commit incomplete or failing work only to satisfy the checkpoint rule. With BATCH_CONTEXT=true, run the pre-mutation isolation self-check before edits, branch-changing commands, commits, pushes, or PR/tracker mutation; require isolation: \"worktree\", expected worktree path, expected branch, artifact repo root, approved base branch, and mutation classification; ensure pwd -P equals the expected worktree path or begins with the expected worktree path followed by / and HEAD matches only the expected branch. Stop on missing metadata, wrong CWD, main-repo CWD, or wrong branch. Produce and verify scope-residual evidence before readiness for broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness work. In workflow_hub mode, prefer workflow-next-action.sh routing evidence and stop before mutation unless artifact owner, mutation target, routing outcome, and routing fingerprint are clear; require selected product repository only for product_owned, allow hub_only with artifact_owner=hub_repository, continue only when ROUTING_CONTINUE_ALLOWED=true, and stop when ROUTING_STOP_REASON or ROUTING_REQUIRED_HUMAN_ACTION is non-empty."

policy:
  allow_implicit_invocation: true
