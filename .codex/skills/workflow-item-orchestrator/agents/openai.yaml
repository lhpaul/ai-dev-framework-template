interface:
  display_name: "Workflow Item Orchestrator"
  short_description: "Advance one workflow item until it reaches a terminal condition."
  default_prompt: "Use $workflow-item-orchestrator to resume one workflow item until terminal. For direct /run-item-style invocations, run the bounded prelude read-only, print policyRecommendation.confirmationSummary, then record the invocation-scoped RUN_ITEM_POLICY_CONFIRMED item/policy binding after explicit flags or human acceptance so the same selected policy is not re-prompted. Still stop for pending checkpoints, guardrail stops, review/CI failures, risk violations, or missing permissions. On checkpoint resume from a prior worktree-isolated run, perform Protocol 91's worktree-resume preflight before mutation; re-entry does not satisfy or waive checkpoint state. With BATCH_CONTEXT=true, run the pre-mutation isolation self-check before edits, branch-changing commands, commits, pushes, PR/tracker mutation, or stage-agent handoff; require isolation: \"worktree\", expected worktree path, expected branch, artifact repo root, approved base branch, and mutation classification; ensure pwd -P equals the expected worktree path or begins with the expected worktree path followed by / and HEAD matches only the expected branch. Stop on missing metadata, wrong CWD, main-repo CWD, or wrong branch. For broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness items, run the scope-residual gate before readiness. If delegated merge authority is active and the gate returns merge_allowed, continue through merge, branch cleanup, post-merge-cleanup, and live tracker verification before reporting terminal. In workflow_hub mode, state selected product repository, artifact owner, and mutation target before implementation mutation."

policy:
  allow_implicit_invocation: true
