interface:
  display_name: "Workflow Item Orchestrator"
  short_description: "Advance one workflow item until it reaches a terminal condition."
  default_prompt: "Use $workflow-item-orchestrator to resume one workflow item until terminal. For direct /run-item-style invocations, run the bounded prelude read-only, print policyRecommendation.confirmationSummary, then record the invocation-scoped RUN_ITEM_POLICY_CONFIRMED item/policy binding after explicit flags or human acceptance so the same selected policy is not re-prompted. Still stop for pending checkpoints, guardrail stops, review/CI failures, risk violations, or missing permissions. For substantial or multi-part mutating item work, instruct the stage agent to commit immediately after each completed logical sub-part and never commit incomplete or failing work only to satisfy the checkpoint rule. On checkpoint resume from a prior worktree-isolated run, invoke Protocol 91's checkpoint-resume-gate.sh with complete item, branch, worktree, main-root, and checkpoint-state context before mutation; continue only on RESULT=continue; pending checkpoints and unclear isolation stop; the gate never satisfies or waives checkpoint state, and main-clone resumes must not change directories. With BATCH_CONTEXT=true, run the pre-mutation isolation self-check before edits, branch-changing commands, commits, pushes, PR/tracker mutation, or stage-agent handoff; require isolation: \"worktree\", expected worktree path, expected branch, artifact repo root, approved base branch, and mutation classification; ensure pwd -P equals the expected worktree path or begins with the expected worktree path followed by / and HEAD matches only the expected branch. Every BATCH_CONTEXT=true stage-agent handoff must include the full checkpoint instruction: For substantial or multi-part mutating item work, commit each completed logical sub-part as soon as it is coherent so agent death or compaction can resume from a recoverable checkpoint. Do not intentionally batch all completed sub-parts into one end-of-run commit. Single-step work with no meaningful completed intermediate checkpoint may use one final commit. Never commit incomplete, broken, or unverified work solely to create a checkpoint. Stop on missing metadata, wrong CWD, main-repo CWD, or wrong branch. Treat merge authority explicitly: merge_granted means readiness is intermediate and the runner continues through merge; merge_denied means the ready PR stops as ready_human_merge and no merge command is run; unexplained stalled-at-ready in a merge-granted run is policy_inconsistent. For broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness items, run the scope-residual gate before readiness. If delegated merge authority is active and the gate returns merge_allowed, continue through merge, branch cleanup, post-merge-cleanup, and live tracker verification before reporting terminal. If the gate returns exceptional_bypass_authorized, follow the canonical exceptional-bypass policy in docs/workflow/development-workflow/guardrails-enforcement.md Gate 5; delegated merge policy is not enough. In workflow_hub mode, state selected product repository, artifact owner, mutation target, routing outcome, and routing fingerprint before implementation mutation; product_owned requires exactly one selected product repository, while hub_only with artifact_owner=hub_repository routes to the hub. Continue only when ROUTING_CONTINUE_ALLOWED=true. Pass ROUTING_CONTINUE_ALLOWED, ROUTING_OUTCOME_CODE, ROUTING_ARTIFACT_OWNER, ROUTING_SELECTED_PRODUCT_REPO_KEY, and ROUTING_FINGERPRINT to implementation handoffs, or require a fresh classifier before mutation. Before reporting any terminal state, run item-completion-self-check.sh for the claimed state and include its Ground-Truth Completion Verification section; when Step 7 was configured, pass --require-review-summary true and --require-review-threads true (helper defaults are false). Treat discrepancy and unavailable_required as non-terminal."

policy:
  allow_implicit_invocation: true
