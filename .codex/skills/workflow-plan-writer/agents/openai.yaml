interface:
  display_name: "Workflow Plan Writer"
  short_description: "Draft an implementation plan from a merged spec."
  default_prompt: "Use $workflow-plan-writer to turn the approved spec into an implementation plan, resolving repository mode and keeping workflow_hub plans hub-owned. For broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness plans, name the residual verification strategy and evidence source implementation must produce before readiness."

policy:
  allow_implicit_invocation: true
