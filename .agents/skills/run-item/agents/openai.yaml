interface:
  display_name: "Run item"
  short_description: "Primary bounded command: advance one non-epic workflow item with shared prelude before Protocol 91."
  default_prompt: "Use $run-item to advance exactly one non-epic workflow item. Run run-bounded-prelude.sh read-only first (scope, guardrails, policy/checkpoints), print policyRecommendation.confirmationSummary with effective policy, field sources, pending checkpoint guidance, copy-paste equivalent, and read-only guarantee, then follow Protocol 91 until a terminal condition. For substantial or multi-part mutating item work, commit immediately after each completed logical sub-part and never commit incomplete or failing work only to satisfy the checkpoint rule. After explicit flags or human acceptance, record the invocation-scoped RUN_ITEM_POLICY_CONFIRMED item/policy binding and do not re-prompt for the same selected policy; still stop for new guardrail stops, pending checkpoints, review/CI failures, risk violations, or missing permissions. On checkpoint resume from a prior worktree-isolated run, perform Protocol 91's worktree-resume preflight before mutation; re-entry does not satisfy or waive checkpoint state. For spec/* and implementation-plan/* PRs, require Protocol 91 Step 8a documentation-stage alignment before accepting ready-for-human-review; mismatches keep the item under supervision until corrected or escalated. Treat merge authority explicitly: merge_granted means readiness is intermediate and the runner continues through merge; merge_denied means the ready PR stops as ready_human_merge and no merge command is run; unexplained stalled-at-ready in a merge-granted run is policy_inconsistent. If delegated merge authority is active and the gate returns merge_allowed, continue through merge, branch cleanup, post-merge-cleanup, and live tracker verification before reporting terminal. Before reporting any terminal state, run item-completion-self-check.sh for the claimed state and include its Ground-Truth Completion Verification section; when Step 7 was configured, pass --require-review-summary true and --require-review-threads true (helper defaults are false). Treat discrepancy and unavailable_required as non-terminal. $run-item-work is a deprecated alias with identical behavior. Epic-like targets should use $run-epic. For broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness items, run the scope-residual gate before readiness. In workflow_hub mode, state selected product repository and mutation target before implementation mutation."

policy:
  allow_implicit_invocation: false
