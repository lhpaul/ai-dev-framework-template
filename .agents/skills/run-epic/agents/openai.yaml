interface:
  display_name: "Run epic"
  short_description: "Resolve an epic or explicit item list into a bounded execution scope with delegated risk and audit gates."
  default_prompt: "Use $run-epic to resolve a native GitHub epic or explicit item list before delegated workflow execution. Keep the resolver read-only; before delegated merge decisions run the read-only PR risk classifier with the invocation's max-risk gate; after delegated decisions create or update stable PR disposition and epic ledger audit comments."

policy:
  allow_implicit_invocation: false
