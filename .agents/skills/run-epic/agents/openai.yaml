interface:
  display_name: "Run epic"
  short_description: "Resolve an epic or explicit item list into a read-only execution scope."
  default_prompt: "Use $run-epic to resolve a native GitHub epic or explicit item list before delegated workflow execution. Keep it read-only: no tracker updates, branches, PRs, merges, issue closure, or cleanup."

policy:
  allow_implicit_invocation: false
