interface:
  display_name: "Run epic"
  short_description: "Compatibility/advanced alias: resolve an epic or explicit item list with explicit delegation flags. Prefer $run-work for the adaptive entrypoint."
  default_prompt: "Use $run-epic to resolve a native GitHub epic or explicit item list with explicit delegation flags. This is a compatibility/advanced alias — prefer $run-work <epic-number> when you do not need direct control over --delegate-review, --may-merge, or --max-risk. Keep the resolver read-only; capture invocation policy flags. If policy is missing or ambiguous, run the read-only policy recommender, present the recommended config in-place, and continue in the same run when accepted. Before delegated merge decisions run the read-only PR risk classifier and delegated gate, then create or update stable PR disposition and epic ledger audit comments including original, recommended, selected, and effective policy."

policy:
  allow_implicit_invocation: false
