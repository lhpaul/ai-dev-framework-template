interface:
  display_name: "Run epic"
  short_description: "Compatibility/advanced alias: resolve an epic or explicit item list with explicit delegation flags. Prefer $run-work for the adaptive entrypoint."
  default_prompt: "Use $run-epic to resolve a native GitHub epic or explicit item list with explicit delegation flags. This is a compatibility/advanced alias — prefer $run-work <epic-number> when you do not need direct control over --delegate-review, --may-merge, or --max-risk. Keep the resolver read-only; capture invocation policy flags. If policy is missing or ambiguous, run the read-only policy recommender, present the recommended config in-place, and continue in the same run when accepted. On checkpoint resume from a prior worktree-isolated item run, perform the Protocol 95/91 worktree-resume preflight before mutation; re-entry does not satisfy or waive checkpoint state. Include residual gate status for broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness sub-items before treating them complete. Before delegated merge decisions run the read-only PR risk classifier, create or update stable PR disposition and epic ledger audit comments including original, recommended, selected, and effective policy, then run the delegated gate. When the gate returns merge_allowed, continue through Protocol 95 Step 11: merge, verify MERGED, delete or prune the branch, run post-merge-cleanup, verify tracker state live, update audit comments, and rediscover scope."

policy:
  allow_implicit_invocation: false
