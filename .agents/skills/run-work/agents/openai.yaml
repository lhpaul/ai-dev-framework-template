interface:
  display_name: "Run work"
  short_description: "Portfolio-only /run-work: no-target scan or explicit multi-item batches. Single targets redirect to $run-item; epics redirect to $run-epic."
  default_prompt: "Use $run-work for portfolio parallel orchestration only. With no target it runs Protocol 90 no-target scan; with two or more work-item targets it runs an explicit bounded batch. Single non-epic targets redirect to $run-item; epic-like targets redirect to $run-epic — /run-work performs no mutation for those. For one bounded item use $run-item; for an epic use $run-epic."

policy:
  allow_implicit_invocation: false
