interface:
  display_name: "Run work"
  short_description: "Inspect workflow state and propose or advance safe batches."
  default_prompt: "Use $run-work to inspect workflow state, advance deterministic in-flight work, and propose the largest safe Backlog start batch. In workflow_hub mode, include selected product repository context in implementation handoffs; single_repo does not require --repo."

policy:
  allow_implicit_invocation: false
