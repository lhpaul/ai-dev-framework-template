interface:
  display_name: "Run work"
  short_description: "Propose portfolio batches (scan-only). No-target scan labels informational, actionable-resume, proposed-batch, and held records with no dispatch. Two or more targets redirect to $run-items. Single targets redirect to $run-item or $run-epic."
  default_prompt: "Use $run-work for portfolio scan and batch proposal only. With no target it runs Protocol 90 Steps 1-3 (scan + propose) and returns a categorized batch recommendation without dispatching any items. Render Protocol 90 categories separately: INFORMATIONAL - not actionable in this proposal, ACTIONABLE RESUME - can advance now, PROPOSED BATCH - your decision, and HELD - not included in proposed batch. Approval applies only to PROPOSED BATCH items; informational records are excluded unless explicitly named in a separate bounded command. With two or more work-item targets it emits redirect_items with REDIRECT_COMMAND=/run-items ... for the operator to execute. Single non-epic targets redirect to $run-item; epic-like targets redirect to $run-epic. /run-work performs no mutation in any mode. For one bounded item use $run-item; for an epic use $run-epic; for multi-item execution use $run-items."

policy:
  allow_implicit_invocation: false
