interface:
  display_name: "Run items"
  short_description: "Multi-item bounded execute: advance an explicit list of two or more workflow items with shared prelude before Protocol 90 explicit_list."
  default_prompt: "Use $run-items to advance an explicit list of two or more non-epic workflow items. Run run-work-router.sh first as read-only validation, then run run-bounded-prelude.sh read-only for scope, guardrails, policy, and checkpoints before following Protocol 90 explicit_list mode until all items reach a terminal state. Before dispatching an explicit-list batch where any runner may mutate, including sequential fallback, build the Protocol 90 isolation manifest and require a distinct absolute worktree path plus isolation: \"worktree\" for every mutating item. Stop before dispatch on missing isolation assignment or duplicate worktree path; non-isolated runners are allowed only when explicitly classified read_only and will not edit files, switch branches, commit, push, mutate PRs, change labels, or update tracker state. Include the incremental commit requirement in substantial or multi-part mutating handoffs: commit immediately after each completed logical sub-part and never commit incomplete or failing work only to satisfy the rule. For checkpoint-resume redispatch, pass checkpoint state with the complete isolation assignment to a fresh runner and require checkpoint-resume-gate.sh before mutation; do not resume a paused runner while sibling runners remain active, and isolation verification never satisfies or waives checkpoint state. For plan-writing handoffs, pass the exact current-batch item list and known same-surface open PR evidence to Protocol 02's Cross-Cutting Operational Assumption Check; keep returned Conflict evidence visible until the parent records Resolved or stops with unclear_requirements and requests Human decision required, and never replace the bounded context with an all-open-PR scan. Require scope-residual gate evidence for broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness items before accepting ready-for-human-review. Require Protocol 91 Step 8a documentation-stage alignment for spec/* and implementation-plan/* PRs before accepting ready-for-human-review; mismatches keep the item under supervision until corrected or escalated. Require each terminal item report to include the Ground-Truth Completion Verification section from item-completion-self-check.sh; when Step 7 was configured, pass --require-review-summary true and --require-review-threads true (helper defaults are false); missing evidence, discrepancy, or unavailable_required keeps the item under supervision. If all in-scope PRs reach ready-for-human-review and effective guardrails allow may_merge_pr: true for their stages, run Guardrails Enforcement Gate 5 for each in-scope PR, including run-epic-risk-classifier.sh and run-epic-delegated-gate.sh; continue only when every normally merged in-scope PR returns merge_allowed. If any PR returns exceptional_bypass_authorized, split it out of the normal batch-merge list and require separate named PR/SHA/fingerprint authorization plus pre-attempt reviewer-access-bypass audit before one exact human-authorized gh pr merge <pr> --admin attempt. Then route normal candidates into Protocol 94 batch merge using only the explicit in-scope PR list: run batch-merge.sh discover --prs <comma-separated-in-scope-prs>, then continue through merge, cleanup, and tracker reconciliation. Delegated batch merge authority never authorizes force-pushing a PR branch; if a destructive PR branch update would be required, stop before mutation and route the exact operation through scripts/development-workflow/workflow-branch-push-guard.sh. Report outcomes as merged, ready_human_merge, merge_blocked, policy_inconsistent, or out_of_scope; merge_granted makes readiness intermediate, merge_denied forbids merge and stops at ready_human_merge. Never use Protocol 94 auto-discovery from $run-items. If guardrails do not allow merge, finish at ready-for-human-review, report the exact stages.<stage>.may_merge_pr: false guardrail for each affected PR, and tell the human to invoke $batch-merge or adjust guardrails. Epic-like tokens stop the invocation and should use $run-epic. One token should use $run-item. Zero tokens should use $run-work."

policy:
  allow_implicit_invocation: false
