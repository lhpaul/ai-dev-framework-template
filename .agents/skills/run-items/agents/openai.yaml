interface:
  display_name: "Run items"
  short_description: "Multi-item bounded execute: advance an explicit list of two or more workflow items with shared prelude before Protocol 90 explicit_list."
  default_prompt: "Use $run-items to advance an explicit list of two or more non-epic workflow items. Run run-work-router.sh first as read-only validation, then run run-bounded-prelude.sh read-only for scope, guardrails, policy, and checkpoints before following Protocol 90 explicit_list mode until all items reach a terminal state. If all in-scope PRs reach ready-for-human-review and effective guardrails allow may_merge_pr: true for their stages, route into Protocol 94 batch merge and continue through merge, cleanup, and tracker reconciliation. If guardrails do not allow merge, finish at ready-for-human-review, report the exact stages.<stage>.may_merge_pr: false guardrail for each affected PR, and tell the human to invoke $batch-merge or adjust guardrails. Epic-like tokens stop the invocation and should use $run-epic. One token should use $run-item. Zero tokens should use $run-work."

policy:
  allow_implicit_invocation: false
