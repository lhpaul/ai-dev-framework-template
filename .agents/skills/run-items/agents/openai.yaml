interface:
  display_name: "Run items"
  short_description: "Multi-item bounded execute: advance an explicit list of two or more workflow items with shared prelude before Protocol 90 explicit_list."
  default_prompt: "Use $run-items to advance an explicit list of two or more non-epic workflow items. Run run-work-router.sh first as read-only validation, then run run-bounded-prelude.sh read-only for scope, guardrails, policy, and checkpoints before following Protocol 90 explicit_list mode until all items reach a terminal state. Require scope-residual gate evidence for broad sweep, batch, helper-extraction, numeric-target, or pattern-completeness items before accepting ready-for-human-review. Require each terminal item report to include the Ground-Truth Completion Verification section from item-completion-self-check.sh; missing evidence, discrepancy, or unavailable_required keeps the item under supervision. If all in-scope PRs reach ready-for-human-review and effective guardrails allow may_merge_pr: true for their stages, run Guardrails Enforcement Gate 5 for each in-scope PR, including run-epic-risk-classifier.sh and run-epic-delegated-gate.sh; continue only when every in-scope PR returns merge_allowed. Then route into Protocol 94 batch merge using only the explicit in-scope PR list: run batch-merge.sh discover --prs <comma-separated-in-scope-prs>, then continue through merge, cleanup, and tracker reconciliation. Never use Protocol 94 auto-discovery from $run-items. If guardrails do not allow merge, finish at ready-for-human-review, report the exact stages.<stage>.may_merge_pr: false guardrail for each affected PR, and tell the human to invoke $batch-merge or adjust guardrails. Epic-like tokens stop the invocation and should use $run-epic. One token should use $run-item. Zero tokens should use $run-work."

policy:
  allow_implicit_invocation: false
