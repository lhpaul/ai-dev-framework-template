# Updates the GitHub Projects tracker status when a workflow PR is merged.
#
# Branch-to-status mapping:
#   spec/*                                  → Spec Ready
#   implementation-plan/*                   → Plan Ready
#   feature/*, fix/*, refactor/*, hotfix/*  → Merged (and close the issue)
#   develop-<slug> (graduation)             → graduation closeout fallback
#     (invokes graduation-closeout-from-merged-pr.sh → graduation-closeout.sh)
#
# The issue number is extracted from the branch name prefix, e.g.:
#   fix/463-some-slug         → issue 463
#   spec/42-user-auth         → issue 42
#   implementation-plan/7-x  → issue 7
#
# Tracker-prefixed branch names (e.g. Linear-style IDs) are also supported:
#   fix/ENG-456-long-slug     → issue 456 (numeric part extracted)
#   feature/PROJ-123-title    → issue 123
# Branches that do not start with a numeric or tracker-prefixed segment are
# skipped with a warning (except graduation heads, which use closeout fallback).
#
# Required repository secrets / variables:
#   GH_PROJECT_TOKEN       — PAT with `project` scope (GITHUB_TOKEN cannot
#                            update Projects v2 fields; a PAT is required)
#   PROJECT_NUMBER         — the integer project number (e.g. 1)
#   PROJECT_OWNER          — the GitHub user or org owning the project
#                            (falls back to github.repository_owner when unset)
#
# Repositories that have not configured a GitHub Project (e.g. freshly created
# from the template) are a supported state: the "Check tracker configuration"
# step below detects the missing secret/variable and skips the tracker update
# with a warning, so merges do not report a failing check. Do not inline that
# check into the actions/github-script step — `github-token` is a *required*
# input of that action, so an empty GH_PROJECT_TOKEN aborts the action before
# any in-script guard can run.
name: Update tracker status on PR merge

on:
  pull_request:
    types: [closed]
    branches:
      - develop

concurrency:
  group: tracker-update-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Least-privilege permissions: only what this workflow needs.
# - contents: read       — checkout repo for graduation closeout fallback scripts
# - pull-requests: read  — read PR metadata (head.ref, merged flag)
# - issues: write        — close the GitHub issue for impl branches
# Note: Projects v2 mutations require GH_PROJECT_TOKEN (PAT) — not GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  update-tracker:
    # Only run when the PR was actually merged (not just closed/declined)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Detect branch type and extract issue number
        id: detect
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Branch: $BRANCH"

          # Determine branch type and target status
          if [[ "$BRANCH" == spec/* ]]; then
            BRANCH_TYPE="spec"
            TARGET_STATUS="Spec Ready"
          elif [[ "$BRANCH" == implementation-plan/* ]]; then
            BRANCH_TYPE="implementation-plan"
            TARGET_STATUS="Plan Ready"
          elif [[ "$BRANCH" == feature/* || "$BRANCH" == fix/* || "$BRANCH" == refactor/* || "$BRANCH" == hotfix/* ]]; then
            BRANCH_TYPE="impl"
            TARGET_STATUS="Merged"
          elif [[ "$BRANCH" == develop-* ]]; then
            SLUG="${BRANCH#develop-}"
            if [[ -z "$SLUG" || ! "$SLUG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "Branch '$BRANCH' looks like a graduation head but slug '$SLUG' is invalid — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "branch_type=graduation_invalid" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "branch_type=graduation"
              echo "graduation_slug=$SLUG"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            echo "Detected: type=graduation, slug=$SLUG (closeout fallback)"
            exit 0
          else
            echo "Branch '$BRANCH' does not match a tracked prefix — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract issue number from the first segment after the prefix slash.
          #
          # Supported formats:
          #   fix/463-some-slug        → ISSUE_NUMBER=463  (plain numeric)
          #   fix/ENG-456-long-slug    → ISSUE_NUMBER=456  (tracker-prefix, e.g. Linear)
          #   feature/PROJ-123-title   → ISSUE_NUMBER=123
          #
          # Branches that match neither format are skipped with a warning.
          SUFFIX="${BRANCH#*/}"            # strip type prefix  → "463-some-slug"
          FIRST="${SUFFIX%%-*}"            # first dash-delimited token → "463" or "ENG"

          if [[ "$FIRST" =~ ^[0-9]+$ ]]; then
            # Plain numeric issue number (most common case)
            ISSUE_NUMBER="$FIRST"
          elif [[ "$FIRST" =~ ^[A-Z][A-Z0-9]*$ ]]; then
            # Possible tracker prefix (e.g. "ENG", "PROJ") — look for the numeric part
            # that immediately follows: ENG-456-long-slug → after stripping "ENG-", get "456"
            AFTER_PREFIX="${SUFFIX#"${FIRST}-"}"        # "456-long-slug"
            ISSUE_NUMBER="${AFTER_PREFIX%%-*}"           # "456"
            if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Could not extract a numeric issue number from tracker-prefixed branch '$BRANCH' (got '$ISSUE_NUMBER') — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tracker-prefixed branch detected: prefix='${FIRST}', issue_number='${ISSUE_NUMBER}'"
          else
            echo "Could not extract a numeric issue number from branch '$BRANCH' (got '$FIRST') — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "branch_type=$BRANCH_TYPE"
            echo "target_status=$TARGET_STATUS"
            echo "issue_number=$ISSUE_NUMBER"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Detected: type=$BRANCH_TYPE, issue=$ISSUE_NUMBER, status=$TARGET_STATUS"

      # Determine whether GitHub Projects is configured for this repository.
      # `secrets` is not available in step-level `if:` conditions, so the secret
      # is read into env here and exposed as a plain step output that later
      # steps can gate on.
      - name: Check tracker configuration
        id: config
        if: steps.detect.outputs.skip == 'false'
        env:
          PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          set -euo pipefail

          missing=""
          if [ -z "${PROJECT_TOKEN:-}" ]; then
            missing="${missing} GH_PROJECT_TOKEN (repository secret)"
          fi
          if [ -z "${PROJECT_NUMBER:-}" ]; then
            missing="${missing} PROJECT_NUMBER (repository variable)"
          fi

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Projects tracker is configured — tracker steps will run."
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::GitHub Projects tracker is not configured for this repository (missing:${missing}) — skipping the tracker status update. See docs/workflow/development-workflow/integrations/github-projects.md."
          {
            echo "## Tracker update skipped"
            echo ""
            echo "GitHub Projects is not configured for this repository, so the tracker"
            echo "status was **not** updated. Missing:"
            echo ""
            for item in GH_PROJECT_TOKEN PROJECT_NUMBER; do
              case "$missing" in
                *"$item"*) echo "- \`${item}\`" ;;
              esac
            done
            echo ""
            echo "Setup instructions: \`docs/workflow/development-workflow/integrations/github-projects.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close issue for impl branches
        if: >
          steps.detect.outputs.skip == 'false' &&
          steps.detect.outputs.branch_type == 'impl'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.detect.outputs.issue_number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json state --jq '.state')
          if [ "$ISSUE_STATE" = "CLOSED" ]; then
            echo "Issue #${ISSUE_NUMBER} is already closed; skipping close."
            exit 0
          fi

          echo "Closing issue #${ISSUE_NUMBER} (implementation PR merged)..."
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --comment "Closed automatically: implementation PR merged to develop."

      - name: Checkout repository for graduation closeout
        if: >
          steps.detect.outputs.skip == 'false' &&
          steps.config.outputs.configured == 'true' &&
          steps.detect.outputs.branch_type == 'graduation'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Run graduation closeout fallback
        if: >
          steps.detect.outputs.skip == 'false' &&
          steps.config.outputs.configured == 'true' &&
          steps.detect.outputs.branch_type == 'graduation'
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GITHUB_PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          GRADUATION_PR: ${{ github.event.pull_request.number }}
          GRADUATION_SLUG: ${{ steps.detect.outputs.graduation_slug }}
        run: |
          set -euo pipefail

          {
            echo "## Graduation closeout fallback"
            echo "- PR: #${GRADUATION_PR}"
            echo "- Head slug: ${GRADUATION_SLUG}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Defensive only: this step is gated on the "Check tracker configuration"
          # step, which already skips the whole tracker path when either value is
          # missing. Reaching these branches means the gate itself is broken, so
          # failing loudly is correct here.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: GH_PROJECT_TOKEN is not configured — cannot run graduation closeout." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "${GITHUB_PROJECT_NUMBER:-}" ]; then
            echo "ERROR: PROJECT_NUMBER variable is not set — cannot run graduation closeout." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Running graduation-closeout-from-merged-pr.sh for PR #${GRADUATION_PR}..."
          set +e
          ./scripts/development-workflow/graduation-closeout-from-merged-pr.sh \
            --graduation-pr "$GRADUATION_PR" | tee /tmp/graduation-closeout.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo ""
            echo '```text'
            cat /tmp/graduation-closeout.log
            echo '```'
            if [ "$status" -eq 0 ]; then
              echo ""
              echo "Result: **pass**"
            else
              echo ""
              echo "Result: **failed** (exit ${status})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Update GitHub Projects status after close
        if: >
          steps.detect.outputs.skip == 'false' &&
          steps.config.outputs.configured == 'true' &&
          steps.detect.outputs.branch_type != 'graduation'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          TARGET_STATUS: ${{ steps.detect.outputs.target_status }}
          ISSUE_NUMBER: ${{ steps.detect.outputs.issue_number }}
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          script: |
            const projectOwner = process.env.PROJECT_OWNER || context.repo.owner;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER, 10);
            const targetStatus = process.env.TARGET_STATUS;
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);

            // This step intentionally runs after the issue-close step. For
            // implementation branches, writing Merged after close compensates
            // for built-in Project "item closed" workflows that set Released.
            if (!projectNumber) {
              core.warning('PROJECT_NUMBER variable is not set — skipping tracker update.');
              return;
            }

            core.info(`Updating project ${projectOwner}/#${projectNumber}: issue ${issueNumber} → "${targetStatus}"`);

            // 1. Get project node ID
            const projectResp = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner: projectOwner, number: projectNumber }).catch(() => null);

            // Retry with organization if user query failed
            let project = projectResp?.user?.projectV2;
            if (!project) {
              const orgResp = await github.graphql(`
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner: projectOwner, number: projectNumber }).catch(() => null);
              project = orgResp?.organization?.projectV2;
            }

            if (!project) {
              core.warning(`Could not find GitHub Project #${projectNumber} for owner "${projectOwner}" — skipping tracker update.`);
              return;
            }

            const projectId = project.id;

            // 2. Find the Status field and the target option ID
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              core.warning('Status field not found in project — skipping tracker update.');
              return;
            }

            const statusOption = statusField.options.find(o => o.name === targetStatus);
            if (!statusOption) {
              core.warning(`Status option "${targetStatus}" not found in project Status field — skipping tracker update.`);
              return;
            }

            // 3. Find the project item ID for this issue
            // Paginate through items to find the matching issue
            let itemId = null;
            let cursor = null;
            do {
              const itemsResp = await github.graphql(`
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          content {
                            ... on Issue { number }
                          }
                        }
                      }
                    }
                  }
                }
              `, { projectId, cursor });

              const items = itemsResp.node.items;
              const match = items.nodes.find(n => n.content?.number === issueNumber);
              if (match) {
                itemId = match.id;
                break;
              }
              cursor = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
            } while (cursor);

            if (!itemId) {
              core.warning(`Issue #${issueNumber} is not in project #${projectNumber} — skipping tracker update.`);
              return;
            }

            // 4. Update the Status field
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId,
              itemId,
              fieldId: statusField.id,
              optionId: statusOption.id,
            });

            core.info(`Successfully updated issue #${issueNumber} status to "${targetStatus}".`);

      - name: Log branch-type to tracker-status mapping summary
        run: |
          echo "=== Branch-type → tracker-status mapping (AC-1, AC-2, AC-3) ==="
          echo "  spec/*                                  → Spec Ready"
          echo "  implementation-plan/*                   → Plan Ready"
          echo "  feature/*, fix/*, refactor/*, hotfix/*  → Merged (and close the issue)"
          echo "  develop-<slug> (graduation)             → graduation closeout fallback"
          echo "========================================================"
          if [ "${{ steps.detect.outputs.skip }}" = "true" ]; then
            echo "This run: SKIP (untracked or invalid branch)"
          elif [ "${{ steps.config.outputs.configured }}" != "true" ]; then
            echo "This run: SKIP (GitHub Projects tracker not configured for this repository)"
          elif [ "${{ steps.detect.outputs.branch_type }}" = "graduation" ]; then
            echo "This run: RUN graduation closeout fallback"
          else
            echo "This run: RUN standard tracker mapping (${{ steps.detect.outputs.branch_type }})"
          fi
          echo "These mappings are verified by scripts/development-workflow/check-tracker-merge-mapping.sh."
