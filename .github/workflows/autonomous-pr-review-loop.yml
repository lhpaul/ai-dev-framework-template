name: Autonomous PR Review Loop

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to resume
        required: true
        type: string

concurrency:
  group: autonomous-pr-review-loop-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  resume:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.review.user.login == 'greptile-apps[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.4' }}
      CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT || 'medium' }}
    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr_number="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          if [ -z "$pr_number" ]; then
            echo "Unable to determine PR number." >&2
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Skip when OPENAI_API_KEY is not configured
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "OPENAI_API_KEY is not configured; skipping autonomous PR review loop."
          exit 0

      - name: Resolve PR head branch
        id: head
        run: |
          head_ref="$(gh pr view "${{ steps.pr.outputs.pr_number }}" --json headRefName --jq '.headRefName')"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run autonomous PR supervisor
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          ./scripts/autonomous-pr-supervisor.sh \
            --pr "${{ steps.pr.outputs.pr_number }}" \
            --event-name "${EVENT_NAME:-workflow_dispatch}" \
            --review-author "${REVIEW_AUTHOR:-}" \
            --review-state "${REVIEW_STATE:-}"
