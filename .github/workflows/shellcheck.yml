name: ShellCheck

on:
  pull_request:
    branches:
      - develop
      # Integration branches (develop-<slug>, protocol 05b). Without this, an
      # epic's sub-item PRs run zero checks and the whole implementation
      # reaches the graduation PR untested (#1525).
      - develop-**
      - main
    paths:
      - 'scripts/**/*.sh'
      - 'scripts/lint/workflow-shell-guard-lint.py'
      - 'scripts/lint/tests/test-workflow-shell-guard-lint.sh'
      - 'scripts/lint/workflow-shell-snippet-lint.py'
      - 'scripts/lint/tests/test-workflow-shell-snippet-lint.sh'
      - 'scripts/lint/review-doctrine-lint.sh'
      - 'scripts/lint/lint-graphql-query-literals.py'
      - 'scripts/lint/tests/test-lint-graphql-query-literals.sh'
      - 'docs/workflow/**'
      - 'docs/best-practices/**'
      - '.agents/skills/**'
      - '.codex/skills/**'
      - '.claude/commands/**'
      - '.claude/agents/**'
      - '.cursor/commands/**'
      - '.cursor/agents/**'
      - 'AGENTS.md'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    name: ShellCheck static analysis
    runs-on: ubuntu-latest
    # Bound the job (#1876). The whole job normally finishes in a few minutes;
    # without a cap a stuck step inherits the 6-hour Actions default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      # One ShellCheck process per file (#1876). Passing every file to a single
      # process makes its peak memory grow with the whole set; one per file
      # bounds it by the largest file, and the findings are the same because
      # nothing here asks ShellCheck to follow sourced files. Peak memory on a
      # single large file grows much faster than its line count — a 21.6k-line
      # test suite needed ~17 GB and got smaller private-repo runners shut down
      # mid-step — which is why test-pr-review-loop.sh's Area 18 caps the size
      # of every pr-review-loop suite.
      - name: Run ShellCheck
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mapfile -d '' -t shell_files < <(find scripts/development-workflow -type f -name "*.sh" -print0 | sort -z)
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No shell files found under scripts/development-workflow — skipping."
            exit 0
          fi
          echo "Analyzing ${#shell_files[@]} shell file(s):"
          printf '  %s\n' "${shell_files[@]}"
          # xargs exits non-zero (123) when any one invocation fails, so a
          # finding in any file still fails the step.
          printf '%s\0' "${shell_files[@]}" \
            | xargs -0 -n 1 -P 2 shellcheck --severity=warning

      - name: Run ShellCheck on review doctrine linter
        run: shellcheck --severity=warning scripts/lint/review-doctrine-lint.sh

      - name: Run GraphQL query literal lint tests
        run: bash scripts/lint/tests/test-lint-graphql-query-literals.sh

      - name: Lint gh api graphql query literals under scripts/
        run: python3 scripts/lint/lint-graphql-query-literals.py scripts

      - name: Run workflow shell guard lint tests
        run: bash scripts/lint/tests/test-workflow-shell-guard-lint.sh

      # zsh is only needed by the cross-shell snippet tests below. This step
      # previously hung indefinitely (issue #1517): `apt-get` blocks waiting on
      # the dpkg/apt lock held by the runner image's `unattended-upgrades`
      # background job, and with no timeout the job inherited the 6-hour
      # Actions default while ShellCheck itself had already passed. Bound it,
      # wait for the lock explicitly, and retry transient mirror failures.
      - name: Install zsh for cross-shell snippet tests
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          if command -v zsh >/dev/null 2>&1; then
            echo "zsh already present: $(zsh --version)"
            exit 0
          fi

          # Wait (bounded) for any apt/dpkg lock holder to finish rather than
          # blocking forever inside apt-get itself.
          for _ in $(seq 1 30); do
            if sudo fuser /var/lib/dpkg/lock-frontend \
                          /var/lib/apt/lists/lock \
                          /var/cache/apt/archives/lock >/dev/null 2>&1; then
              echo "apt/dpkg lock held; waiting 5s..."
              sleep 5
            else
              break
            fi
          done

          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install --yes --no-install-recommends zsh; then
              echo "zsh installed: $(zsh --version)"
              exit 0
            fi
            echo "apt-get attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done

          echo "ERROR: could not install zsh after 3 attempts." >&2
          exit 1

      - name: Run workflow shell snippet lint tests
        run: bash scripts/lint/tests/test-workflow-shell-snippet-lint.sh

      - name: Validate pull request base ref
        run: |
          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "ERROR: GITHUB_BASE_REF is required for workflow shell guard lint." >&2
            echo "This workflow must run in a pull_request context." >&2
            exit 1
          fi

      - name: Fetch base ref for workflow shell guard lint
        run: git fetch --no-tags origin "$GITHUB_BASE_REF"

      - name: Run workflow shell guard lint
        run: python3 scripts/lint/workflow-shell-guard-lint.py --base-ref "origin/$GITHUB_BASE_REF"

      - name: Run workflow shell snippet lint
        run: python3 scripts/lint/workflow-shell-snippet-lint.py --base-ref "origin/$GITHUB_BASE_REF"
