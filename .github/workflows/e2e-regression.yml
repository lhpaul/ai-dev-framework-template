name: E2E / Regression Tests (Template Placeholder)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test.
        required: true
      head_sha:
        description: Pull request head SHA to check out.
        required: true
      head_ref:
        description: Pull request head branch name.
        required: false
      base_ref:
        description: Pull request base branch name.
        required: true
  pull_request:
    types: [labeled, synchronize, reopened]
    branches:
      - develop
      # Integration branches (develop-<slug>, protocol 05b). Without this, an
      # epic's sub-item PRs run zero checks and the whole implementation
      # reaches the graduation PR untested (#1525).
      - develop-**
      - main

concurrency:
  group: e2e-regression-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E regression (placeholder)
    if: >-
      vars.ENABLE_TEMPLATE_PLACEHOLDER_REGRESSION == 'true' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.base_ref == 'develop' ||
            startsWith(inputs.base_ref, 'develop-') ||
            inputs.base_ref == 'main'
          )
        ) ||
        (github.event.action == 'labeled' && github.event.label.name == 'ready-for-regression') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ready-for-regression'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
