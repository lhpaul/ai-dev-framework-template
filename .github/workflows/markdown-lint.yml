name: Markdown Lint

on:
  pull_request:
    branches:
      - develop
      # Integration branches (develop-<slug>, protocol 05b). Without this, an
      # epic's sub-item PRs run zero checks and the whole implementation
      # reaches the graduation PR untested (#1525).
      - develop-**
      - main
    paths:
      - 'docs/specs/developments/**'
      - 'docs/testing/workflow/**'
      - 'docs/workflow/development-workflow/strict-spec-checks.md'
      - 'changelog.d/**'
      - 'CHANGELOG.md'
      - '.markdownlint.jsonc'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/development-workflow/changelog-fragments.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lint/markdown-heuristic-lint.py'
      - 'scripts/lint/check-changelog-duplicate-headers.sh'

jobs:
  markdown-lint:
    name: Markdown lint (spec/plan/CHANGELOG)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect target markdown files
        id: collect
        run: |
          mapfile -d '' -t md_files < <(
            find docs/specs/developments docs/testing/workflow changelog.d -type f -name "*.md" -print0 2>/dev/null
          )
          if [ -f CHANGELOG.md ]; then
            md_files+=("CHANGELOG.md")
          fi
          if [ -f docs/workflow/development-workflow/strict-spec-checks.md ]; then
            md_files+=("docs/workflow/development-workflow/strict-spec-checks.md")
          fi
          if [ "${#md_files[@]}" -eq 0 ]; then
            echo "No target markdown files found — skipping lint."
            echo "found_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "found_files=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#md_files[@]} markdown file(s) to lint:"
            printf '  %s\n' "${md_files[@]}"
          fi

      - name: Run markdownlint-cli2
        if: steps.collect.outputs.found_files == 'true'
        run: |
          ./node_modules/.bin/markdownlint-cli2 \
            "docs/specs/developments/**/*.md" \
            "docs/testing/workflow/**/*.md" \
            "changelog.d/**/*.md" \
            "CHANGELOG.md" \
            "docs/workflow/development-workflow/strict-spec-checks.md"

      - name: Run heuristic lint checks (GLOB001, COUNT001)
        if: steps.collect.outputs.found_files == 'true'
        run: |
          mapfile -d '' -t md_files < <(
            find docs/specs/developments docs/testing/workflow changelog.d -type f -name "*.md" -print0 2>/dev/null
          )
          if [ -f CHANGELOG.md ]; then
            md_files+=("CHANGELOG.md")
          fi
          if [ -f docs/workflow/development-workflow/strict-spec-checks.md ]; then
            md_files+=("docs/workflow/development-workflow/strict-spec-checks.md")
          fi
          python3 scripts/lint/markdown-heuristic-lint.py "${md_files[@]}"

      - name: Validate changelog fragments
        run: bash scripts/development-workflow/changelog-fragments.sh validate

      - name: Check CHANGELOG for duplicate section headers
        run: bash scripts/lint/check-changelog-duplicate-headers.sh CHANGELOG.md
