name: pr-review-loop test harness

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'scripts/development-workflow/pr-review-loop.sh'
      - 'scripts/development-workflow/workflow-lib.sh'
      - 'scripts/development-workflow/tests/test-pr-review-loop.sh'

concurrency:
  group: test-pr-review-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-harness:
    name: pr-review-loop test harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run test harness
        run: bash scripts/development-workflow/tests/test-pr-review-loop.sh
