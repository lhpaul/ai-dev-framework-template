name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # For pull_request events: always run, including bot-authored PRs (Dependabot, Renovate).
    # For issue_comment events: only run when a human comments on a PR (not an issue),
    # preventing PR-Agent from triggering itself when it posts its own review comment.
    if: ${{ github.event_name == 'pull_request' || (github.event.sender.type != 'Bot' && github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: PR-Agent review
    steps:
      - name: PR-Agent
        uses: the-pr-agent/pr-agent@009ba5a116c4d3273368a6dc53a4efdb7904d519 # v0.34.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Model: DeepSeek (via LiteLLM) ---
          # Pinned as env vars in addition to .pr_agent.toml: PR-Agent can fall back
          # to its Qodo-hosted GPT-5.4 default before TOML settings are fully merged,
          # causing AuthenticationError on every run when only DEEPSEEK_API_KEY is set.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "deepseek/deepseek-chat"
          config.fallback_models: '["deepseek/deepseek-chat"]'
          # config.model_weak controls ancillary tasks (PR description generation,
          # classification, file summaries). PR-Agent's built-in default is OpenAI's
          # gpt-5.4 / gpt-5.4-mini, which fails with `dummy_key` 401 errors when only
          # DEEPSEEK_API_KEY is configured. Pin it to DeepSeek too so all calls go
          # through one provider.
          config.model_weak: "deepseek/deepseek-chat"
          # --- Alternative: Kimi K2.6 (Moonshot AI) ---
          # Comment out the DeepSeek vars above, uncomment below, and set
          # MOONSHOT_API_KEY in GitHub secrets.
          # MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          # config.model: "moonshot/kimi-k2.6"
          # config.fallback_models: '["moonshot/kimi-k2.6"]'
          # config.model_weak: "moonshot/kimi-k2.6"
          # --- Action and feature flags ---
          # Set as env vars (not only in .pr_agent.toml) so they take effect
          # before PR-Agent's internal action/feature checks run.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
