name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # For pull_request events: only run for PRs from the same repository (not forks),
    # including bot-authored PRs (Dependabot, Renovate). Fork PRs use read-only GITHUB_TOKEN
    # that cannot post comments, so excluding them prevents spurious auth failures.
    # Pushes to same-repository PR branches run PR-Agent through the pull_request
    # synchronize event. The reviewer loop and maintainers can also trigger an
    # explicit review by posting exactly `/review` on the PR. Exact command
    # matching prevents PR-Agent from retriggering itself while still allowing
    # trusted automation identities to request a configured review.
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/review') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: PR-Agent review
    steps:
      - name: Resolve the trusted PR base revision
        id: trusted-base
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('PR-Agent requires a same-repository pull request');
            }
            if (!/^[0-9a-f]{40}$/.test(pr.base.sha)) {
              throw new Error('Cannot resolve the trusted PR base revision');
            }
            core.setOutput('sha', pr.base.sha);
      - name: Check out the trusted PR base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # All executable repository code and configuration come from this
          # revision, including for /review requests targeting a non-default base.
          ref: ${{ steps.trusted-base.outputs.sha }}
          persist-credentials: false
      - name: PR-Agent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Model: DeepSeek (via LiteLLM) ---
          # Pinned as env vars in addition to .pr_agent.toml: PR-Agent can fall back
          # to its Qodo-hosted GPT-5.x default before TOML settings are fully merged,
          # causing AuthenticationError on every run when only DEEPSEEK_API_KEY is set.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "deepseek/deepseek-chat"
          config.fallback_models: '["deepseek/deepseek-chat"]'
          # config.model_weak controls ancillary tasks (PR description generation,
          # classification, file summaries). PR-Agent's built-in default is OpenAI's
          # GPT-5.x family, which fails with `dummy_key` 401 errors when only
          # DEEPSEEK_API_KEY is configured. Pin it to DeepSeek too so all calls go
          # through one provider.
          config.model_weak: "deepseek/deepseek-chat"
          # --- Alternative: Kimi K2.6 (Moonshot AI) ---
          # Comment out the DeepSeek vars above, uncomment below, and set
          # MOONSHOT_API_KEY in GitHub secrets.
          # MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          # config.model: "moonshot/kimi-k2.6"
          # config.fallback_models: '["moonshot/kimi-k2.6"]'
          # config.model_weak: "moonshot/kimi-k2.6"
          # --- Action and feature flags ---
          # Set as env vars (not only in .pr_agent.toml) so they take effect
          # before PR-Agent's internal action/feature checks run.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
        run: |
          set -euo pipefail
          IMAGE="$(python3 scripts/development-workflow/pr-agent-runtime.py --image)"
          docker run --rm --entrypoint python \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/github/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_EVENT_PATH,dst=/github/event.json,readonly" \
            --mount "type=bind,src=$GITHUB_OUTPUT,dst=/github/output" \
            --env GITHUB_WORKSPACE=/github/workspace --env GITHUB_EVENT_PATH=/github/event.json \
            --env GITHUB_OUTPUT=/github/output \
            --env GITHUB_EVENT_NAME --env GITHUB_REPOSITORY --env GITHUB_REPOSITORY_OWNER \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_BASE_REF --env GITHUB_HEAD_REF \
            --env GITHUB_SERVER_URL --env GITHUB_API_URL --env GITHUB_ACTIONS \
            --env GITHUB_RUN_ID --env GITHUB_RUN_NUMBER --env GITHUB_ACTOR \
            --env GITHUB_TOKEN --env DEEPSEEK_API_KEY --env MOONSHOT_API_KEY \
            --env config.model --env config.fallback_models --env config.model_weak \
            --env github_action_config.pr_actions --env github_action_config.auto_review \
            --env github_action_config.auto_describe --env github_action_config.auto_improve \
            "$IMAGE" /github/workspace/scripts/development-workflow/pr-agent-runtime.py
