# Asserts that the automated reviewer-loop summary comment is present on an
# implementation PR before the PR may be treated as merge-eligible. Posts a
# GitHub commit status (success/failure) after inspecting the PR's comment
# timeline for the canonical two-marker combination produced by pr-review-loop.sh.
#
# Markers checked (both must be present in the same comment):
#   ### Automated Reviewer Loop Summary
#   *Posted automatically by `pr-review-loop.sh`.*
#
# Event model:
#   pull_request_target — performs one fast summary check and posts the
#     PR-scoped status immediately. Missing summaries fail without sleeping.
#   issue_comment — ignores non-PR and non-summary comments, then re-checks the
#     PR comments and posts success when the canonical summary is present.
#
# In-scope branch prefixes (configurable via IN_SCOPE_PREFIXES env var):
#   feature/  fix/  refactor/  hotfix/
#
# Branches outside the in-scope list always pass (status set to success).
# Fork-head PRs are skipped and do not receive guard statuses from this workflow.
#
# The commit-status context name uses a PR-number suffix
# ("Reviewer-loop completion guard (#<PR_NUMBER>)") to prevent two PRs that
# share the same commit SHA (e.g. a main PR and its backport) from
# overwriting each other's guard result.
#
# Branch-protection required checks: add the expected context name for each
# PR number you want to enforce, or use a wildcard pattern if your provider
# supports it. In practice, most teams enable the guard via a status-check
# pattern rule rather than a fixed context string.
# See docs/workflow/development-workflow/integrations/ci-enforcement.md for setup.
#
# Downstream override: edit IN_SCOPE_PREFIXES to change the in-scope prefix list.
name: Reviewer-loop completion guard

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

concurrency:
  group: >-
    reviewer-loop-guard-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '### Automated Reviewer Loop Summary') &&
      'summary-comment' ||
      github.event_name == 'issue_comment' &&
      'non-summary' ||
      'pr-event'
    }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
      statuses: write

    steps:
      - name: Check for Automated Reviewer Loop Summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          # Override IN_SCOPE_PREFIXES in your repository to customise which branches
          # are subject to this guard. Default covers the four standard implementation
          # prefixes. Branches outside this list always pass.
          IN_SCOPE_PREFIXES: "feature/ fix/ refactor/ hotfix/"
        run: |
          set -euo pipefail

          MARKER1="### Automated Reviewer Loop Summary"
          # shellcheck disable=SC2016
          MARKER2='*Posted automatically by `pr-review-loop.sh`.*'
          GUARD_CONTEXT="Reviewer-loop completion guard (#${PR_NUMBER})"
          EVENT_COMMENT_HAS_SUMMARY=false

          post_failure_status_if_possible() {
            local sha="$1"
            local description="$2"

            if [ -z "${sha:-}" ]; then
              echo "WARN: cannot post guard failure status because the PR head SHA is unavailable." >&2
              return 0
            fi

            gh api \
              --method POST \
              "repos/$REPO/statuses/$sha" \
              -f state="failure" \
              -f description="$description" \
              -f context="$GUARD_CONTEXT"
          }

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            case "$COMMENT_BODY" in
              *"$MARKER1"*"$MARKER2"*|*"$MARKER2"*"$MARKER1"*) EVENT_COMMENT_HAS_SUMMARY=true ;;
              *)
                echo "Issue comment does not contain the canonical reviewer-loop summary markers; skipping."
                exit 0
                ;;
            esac
          fi

          if ! pr_json="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"; then
            echo "ERROR: failed to fetch PR #${PR_NUMBER} metadata."
            post_failure_status_if_possible \
              "${EVENT_HEAD_SHA:-}" \
              "Could not fetch PR metadata. Re-run the workflow to retry."
            exit 1
          fi

          if ! HEAD_SHA="$(printf '%s\n' "$pr_json" | jq -er '.head.sha')"; then
            echo "ERROR: pull request head SHA is missing for PR #${PR_NUMBER}." >&2
            post_failure_status_if_possible \
              "${EVENT_HEAD_SHA:-}" \
              "Could not resolve PR head SHA. Re-run the workflow to retry."
            exit 1
          fi
          if ! BRANCH="$(printf '%s\n' "$pr_json" | jq -er '.head.ref')"; then
            echo "ERROR: pull request head branch is missing for PR #${PR_NUMBER}." >&2
            post_failure_status_if_possible \
              "$HEAD_SHA" \
              "Could not resolve PR head branch. Re-run the workflow to retry."
            exit 1
          fi
          if ! HEAD_REPO="$(printf '%s\n' "$pr_json" | jq -er '.head.repo.full_name')"; then
            echo "ERROR: pull request head repository is missing for PR #${PR_NUMBER}." >&2
            post_failure_status_if_possible \
              "$HEAD_SHA" \
              "Could not resolve PR head repository. Re-run the workflow to retry."
            exit 1
          fi

          if [ "$EVENT_NAME" != "issue_comment" ]; then
            HEAD_SHA="${EVENT_HEAD_SHA:-$HEAD_SHA}"
            BRANCH="${EVENT_BRANCH:-$BRANCH}"
            HEAD_REPO="${EVENT_HEAD_REPO:-$HEAD_REPO}"
          fi

          echo "PR #${PR_NUMBER}: evaluating branch '${BRANCH}' against in-scope prefixes: ${IN_SCOPE_PREFIXES}"

          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "PR #${PR_NUMBER} head repository '${HEAD_REPO}' differs from base '${REPO}'; skipping guard status."
            exit 0
          fi

          in_scope=false
          for prefix in $IN_SCOPE_PREFIXES; do
            if [[ "$BRANCH" == "${prefix}"* ]]; then
              in_scope=true
              break
            fi
          done

          if [ "$in_scope" = "false" ]; then
            echo "Branch '${BRANCH}' is not in scope; posting success status (guard skipped)."
            gh api \
              --method POST \
              "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="success" \
              -f description="Not an implementation branch; guard skipped." \
              -f context="$GUARD_CONTEXT"
            exit 0
          fi

          echo "Branch '${BRANCH}' is in scope; inspecting PR comments for reviewer-loop summary."

          if ! FOUND="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --paginate \
            | jq -rs --arg m1 "$MARKER1" --arg m2 "$MARKER2" \
            'add // []
            | [.[] | select(
              (.body // "" | contains($m1)) and
              (.body // "" | contains($m2))
            )] | length')"; then
            if [ "$EVENT_COMMENT_HAS_SUMMARY" = "true" ]; then
              echo "Failed to fetch PR comments, but triggering comment has summary markers; counting event payload."
              FOUND=1
            else
              echo "ERROR: failed to fetch PR comments; posting retry-oriented failure status."
              gh api \
                --method POST \
                "repos/$REPO/statuses/$HEAD_SHA" \
                -f state="failure" \
                -f description="Could not fetch PR comments. Re-run the workflow to retry." \
                -f context="$GUARD_CONTEXT"
              exit 1
            fi
          fi

          if [ "$EVENT_COMMENT_HAS_SUMMARY" = "true" ] && [ "${FOUND:-0}" -eq 0 ]; then
            echo "Fresh comment listing did not include triggering summary comment; counting event payload."
            FOUND=1
          fi

          echo "Reviewer-loop summary comments found: ${FOUND}"

          if [ "${FOUND:-0}" -gt 0 ]; then
            STATE="success"
            DESCRIPTION="Reviewer-loop summary present."
          else
            STATE="failure"
            DESCRIPTION="No reviewer-loop summary found. Run the automated reviewer loop before merging."
          fi

          gh api \
            --method POST \
            "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f description="$DESCRIPTION" \
            -f context="$GUARD_CONTEXT"

          echo "Posted commit status '${STATE}' for SHA ${HEAD_SHA} with context '${GUARD_CONTEXT}'."

          if [ "$STATE" = "failure" ]; then
            echo "Guard FAILED: the automated reviewer loop must run to completion before this PR is treated as ready."
            exit 1
          fi

          echo "Guard PASSED: reviewer-loop summary is present."
