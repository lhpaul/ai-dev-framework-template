# Automatically creates a git tag and GitHub release when a release/* or hotfix/* PR is merged into main.
# For release/* branches: the tag is extracted from the branch name (e.g., release/v1.2.0 → tag v1.2.0).
# For hotfix/* branches: the version is extracted from the topmost versioned section in CHANGELOG.md
#   (the entry written by the developer as part of the hotfix process per 03-implement-development-protocol.md).
# Release notes are pulled from the matching section in CHANGELOG.md.
name: Auto-tag release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Extract version
        id: extract_version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BRANCH" == release/* ]]; then
            # release/* — version is encoded in the branch name
            VERSION="${BRANCH#release/}"
          else
            # hotfix/* — version is the first versioned section in CHANGELOG.md.
            # Per the hotfix protocol, the developer inserts ## [X.Y.Z] - YYYY-MM-DD directly
            # below [Unreleased], making it the first versioned header in the file.
            # Guard 1: confirm [Unreleased] is still present (protocol invariant).
            if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
              echo "ERROR: CHANGELOG.md is missing the [Unreleased] section."
              echo "       Hotfix CHANGELOG entries must be placed below [Unreleased]."
              exit 1
            fi
            # Guard 2: extract the first versioned section (X.Y.Z numeric prefix,
            # skipping [Unreleased] and non-semver headers).
            FIRST_VERSIONED=$(grep -Em 1 '^## \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)
            if [ -z "$FIRST_VERSIONED" ]; then
              echo "ERROR: Hotfix requires a versioned section header (## [X.Y.Z]) in CHANGELOG.md."
              echo "       No versioned ## header found."
              echo "       Add the hotfix versioned section below [Unreleased] before merging."
              exit 1
            fi
            VERSION_CLEAN=$(printf '%s\n' "$FIRST_VERSIONED" | sed 's/^## \[\([^]]*\)\].*/\1/')
            VERSION="v${VERSION_CLEAN}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Extract release notes from CHANGELOG
        id: release_notes
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # Strip leading 'v' to match CHANGELOG format (e.g., v1.2.0 → [1.2.0])
          VERSION_CLEAN="${VERSION#v}"
          # Escape dots so they match literal '.' not any character in the awk regex
          VERSION_ESCAPED=$(echo "$VERSION_CLEAN" | sed 's/\./\\./g')
          NOTES=$(awk "/^## \[$VERSION_ESCAPED\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: No CHANGELOG entry found for version $VERSION_CLEAN. Aborting before tag is created."
            exit 1
          fi
          # Use multiline output safely
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create and push tag
        env:
          TAG: ${{ steps.extract_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          VERSION: ${{ steps.extract_version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "$RELEASE_NOTES" \
            --target "$MERGE_SHA"
