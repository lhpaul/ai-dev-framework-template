# CodeRabbit configuration
#
# This file controls CodeRabbit's behavior for this repository.
# Docs: https://docs.coderabbit.ai/reference/configuration
#
# CodeRabbit is disabled by default so repository review policy remains
# explicit in .ai-dev-workflow.yaml. To opt in to CodeRabbit GitHub App review:
# - set reviews.auto_review.enabled to true
# - add "coderabbit" to review.on_draft.github or review.on_ready.github
# - keep drafts false unless the repository intentionally wants draft PR review

reviews:
  tools:
    github-checks:
      enabled: true
      timeout_ms: 600000
  auto_review:
    enabled: false
    drafts: false
    auto_pause_after_reviewed_commits: 1
    base_branches:
      - develop
  path_filters:
    - "!dist/**"
    - "!**/*.generated.*"
    - "!**/*.lock"
    - "!**/node_modules/**"
  profile: "assertive"
  # Scope restriction: restrict CodeRabbit's review to files in the PR diff.
  # When set to true, CodeRabbit only comments on files that appear in the PR's
  # changed files list. It will not expand its review to files outside the diff
  # (e.g., tangentially related documentation or config files).
  # This prevents scope inflation where CodeRabbit flags unrelated files and
  # causes agents to make unintended edits that increase PR diff size and risk.
  changed_files_only: true
  path_instructions:
    - path: "**/*.sh"
      instructions: "Do not report on docstring coverage. Bash and shell scripts have no formal docstring standard; skip any docstring-coverage warnings for these files."
