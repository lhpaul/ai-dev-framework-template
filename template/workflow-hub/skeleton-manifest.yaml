schema_version: 1
skeleton_role: workflow_hub
mode_scope: hub_only
description: Workflow-owned files for a repository that coordinates work across product repositories.

entries:
  - group: review contract
    path: REVIEW.md
    mode_scope: shared
    note: canonical review contract used by hub-owned spec, plan, and workflow code review gates
  - group: workflow documentation
    path: docs/workflow/
    glob: "**/*"
    mode_scope: hub_only
    note: canonical protocols, integrations, repository mode guidance, and workflow runbooks
  - group: workflow scripts
    path: scripts/development-workflow/
    glob: "**/*"
    mode_scope: hub_only
    note: orchestration, PR readiness, CI loop, reviewer-loop, release, and configuration helpers
  - group: lint helpers
    path: scripts/lint/
    glob: "**/*"
    mode_scope: shared
    note: markdown and changelog lint helpers referenced by workflow protocols
  - group: Claude Code agents and commands
    path: .claude/
    glob: "**/*"
    mode_scope: hub_only
    note: Claude Code agent, command, skill, and settings examples for hub-owned workflow execution
  - group: Codex skills
    path: .codex/skills/
    glob: "**/*"
    mode_scope: hub_only
    note: canonical Codex workflow skills
  - group: repo-scoped Codex skills
    path: .agents/skills/
    glob: "**/*"
    mode_scope: hub_only
    note: command-style Codex aliases and repo-scoped skill discovery metadata
  - group: Cursor agents, commands, and rules
    path: .cursor/
    glob: "**/*"
    mode_scope: hub_only
    note: Cursor command wrappers, workflow agents, and repository rules
  - group: shared workflow configuration
    path: .ai-dev-workflow.yaml
    mode_scope: shared
    note: versioned repository mode, provider, tracker, and template metadata
  - group: local workflow configuration example
    path: .ai-dev-workflow.local.example.yaml
    mode_scope: shared
    note: placeholder-only example for local checkout roots, product paths, and secret references
  - group: setup and project documentation placeholders
    path: docs/project/
    glob: "**/*"
    mode_scope: shared
    note: generated per repository during setup; project-specific after adoption
  - group: best-practice guidance
    path: docs/best-practices/
    glob: "**/*"
    mode_scope: shared
    note: framework defaults and project-specific stack guidance templates
  - group: hub-owned workflow artifacts
    path: docs/specs/developments/
    glob: "**/*"
    mode_scope: hub_only
    generated_example: true
    note: hub-owned specs and implementation plans generated by workflow items
  - group: workflow smoke runbooks
    path: docs/testing/workflow/
    glob: "**/*"
    mode_scope: hub_only
    note: hub-owned workflow validation runbooks and smoke-test evidence
  - group: role-specific skeletons
    path: template/
    glob: "**/*"
    mode_scope: shared
    note: inspectable workflow-hub and product-repo-injection skeleton documentation
